name: Publish ORBIT to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Detect website directory
        id: source
        shell: bash
        run: |
          if [ -f dist/index.html ]; then
            echo "directory=dist" >> "$GITHUB_OUTPUT"
            echo "check=scripts/check.mjs" >> "$GITHUB_OUTPUT"
          elif [ -f website/dist/index.html ]; then
            echo "directory=website/dist" >> "$GITHUB_OUTPUT"
            echo "check=website/scripts/check.mjs" >> "$GITHUB_OUTPUT"
          else
            echo "ORBIT dist/index.html not found"
            exit 1
          fi
      - name: Check local assets and JavaScript
        run: node "${{ steps.source.outputs.check }}"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.source.outputs.directory }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
